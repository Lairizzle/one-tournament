<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | One Tournament</title>
{{ $css := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>

<body>

<main>

<h1>One Tournament Admin</h1>

<section id="login-panel" class="panel login">

<h2>Admin Login</h2>

<form id="login-form">
<label>
Password
<input id="password" type="password" required autofocus>
</label>

<button type="submit">Login</button>
</form>

<div id="login-message"></div>

</section>

<div id="app" class="hidden">

<section class="panel">

<div class="row">

<div class="toolbar-grow">
<label>
Selected Tournament
<select id="tournament-select"></select>
</label>
</div>

<button type="button" class="secondary" id="refresh">
Refresh
</button>

<a href="/" class="public-link">
Public Site
</a>

</div>

<div id="message"></div>

</section>

<section class="panel">

<h2>Create Tournament</h2>

<form id="create-tournament-form">

<label>
Name
<input id="create-name" required placeholder="1v1">
</label>

<label>
Description
<textarea id="create-description" placeholder="Naked"></textarea>
</label>

<button type="submit">
Create Tournament
</button>

</form>

</section>

<section id="manage" class="hidden">

<section class="panel">

<h2>Tournament Setup</h2>

<div id="summary" class="grid"></div>

<form id="edit-tournament-form" class="form-spaced">

<label>
Name
<input id="edit-name" required>
</label>

<label>
Description
<textarea id="edit-description"></textarea>
</label>

<button type="submit">
Save Tournament
</button>

</form>

<div class="inline-actions">

<button type="button" data-status="setup" class="secondary">
Setup
</button>

<button type="button" data-status="betting" class="secondary">
Betting
</button>

<button type="button" data-status="in_progress" class="secondary">
In Progress
</button>

<button type="button" data-status="completed" class="secondary">
Completed
</button>

<button type="button" id="delete-tournament" class="danger">
Delete Tournament
</button>

</div>

</section>

<section class="panel">

<h2>Competitors</h2>

<form id="competitor-form">

<label>
Name
<input id="competitor-name" required>
</label>

<button type="submit">
Add Competitor
</button>

</form>

<div id="competitors" class="section-list"></div>

</section>

<section class="panel">

<h2>Bracket</h2>

<p class="muted">
Generate once the competitor list is complete. Round 1 byes can be processed automatically.
</p>

<div class="inline-actions">

<button type="button" id="generate-bracket">
Generate Bracket
</button>

<button type="button" id="process-byes" class="secondary">
Process Byes
</button>

</div>

<div id="bracket" class="grid section-list"></div>

</section>

<section class="panel">

<h2>Bettors</h2>

<form id="bettor-form">

<label>
Name
<input id="bettor-name" required>
</label>

<button type="submit">
Add Bettor
</button>

</form>

<div id="bettors" class="grid section-list"></div>

</section>

<section class="panel">

<h2>Wager Entry</h2>

<form id="wager-form">

<label>
Match
<select id="wager-match" required></select>
</label>

<label>
Bettor
<select id="wager-bettor" required></select>
</label>

<label>
Competitor
<select id="wager-competitor" required></select>
</label>

<label>
Gold
<input id="wager-amount" type="number" min="1" step="1" required>
</label>

<button type="submit">
Record Wager
</button>

</form>

<div id="wager-odds" class="notice muted"></div>

<div id="wagers" class="section-list-sm"></div>

</section>

</section>

</div>

</main>

<script>

let token="";
let tournamentId=null;
let tournament=null;
let competitors=[];
let bettors=[];
let rounds=[];

const $=id=>document.getElementById(id);

function html(v){
  return String(v??"").replace(/[&<>'"]/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    "\"":"&quot;"
  }[c]));
}

function setMessage(text,type=""){
  const box=$("message");

  box.className=`notice ${type}`;
  box.textContent=text;
  box.hidden=!text;
}

function setLoginMessage(text){
  $("login-message").className="notice error";
  $("login-message").textContent=text;
  $("login-message").hidden=!text;
}

async function api(path,options={}){
  const headers={
    ...(options.headers||{}),
    Authorization:`Bearer ${token}`
  };

  if(options.body!==undefined){
    headers["Content-Type"]="application/json";
  }

  const r=await fetch(path,{
    ...options,
    headers
  });

  let data;

  try{
    data=await r.json();
  }catch{
    data={
      error:`HTTP ${r.status}`
    };
  }

  if(!r.ok){
    throw new Error(
      data.error||`Request failed (${r.status})`
    );
  }

  return data;
}

async function login(e){

  e.preventDefault();

  setLoginMessage("");

  const value=$("password").value;

  const r=await fetch("/api/admin/ping",{
    headers:{
      Authorization:`Bearer ${value}`
    }
  });

  if(!r.ok){
    setLoginMessage("Invalid admin password.");
    return;
  }

  token=value;

  $("login-panel").classList.add("hidden");
  $("app").classList.remove("hidden");

  await loadAll();
}

$("login-form").addEventListener(
  "submit",
  e=>login(e).catch(err=>setLoginMessage(err.message))
);

async function loadAll(){

  setMessage("Loading...");

  const list=await fetch("/api/tournaments").then(async r=>{

    const d=await r.json();

    if(!r.ok){
      throw new Error(
        d.error||"Could not load tournaments"
      );
    }

    return d;
  });

  const select=$("tournament-select");

  select.innerHTML=list.length
    ?list.map(t=>`
      <option value="${t.id}">
        #${t.id} ${html(t.name)} — ${html(t.status)}
      </option>
    `).join("")
    :"";

  if(!list.length){

    tournamentId=null;

    $("manage").classList.add("hidden");

    setMessage(
      "No tournaments yet. Create one below."
    );

    return;
  }

  if(
    !list.some(
      t=>Number(t.id)===Number(tournamentId)
    )
  ){
    tournamentId=Number(list[0].id);
  }

  select.value=tournamentId;

  $("manage").classList.remove("hidden");

  await loadTournament();

  setMessage("");
}

$("refresh").addEventListener(
  "click",
  ()=>loadAll().catch(e=>setMessage(e.message,"error"))
);

$("tournament-select").addEventListener(
  "change",
  async()=>{

    tournamentId=Number($("tournament-select").value);

    try{
      await loadTournament();
      setMessage("");
    }catch(e){
      setMessage(e.message,"error");
    }
  }
);

$("create-tournament-form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    try{

      const data=await api(
        "/api/admin/tournaments",
        {
          method:"POST",
          body:JSON.stringify({
            name:$("create-name").value,
            description:$("create-description").value
          })
        }
      );

      $("create-name").value="";
      $("create-description").value="";

      tournamentId=Number(data.id);

      setMessage(
        `Created tournament #${data.id}: ${data.name}`,
        "success"
      );

      await loadAll();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

async function loadTournament(){

  tournament=await api(
    `/api/tournaments/${tournamentId}`
  );

  $("edit-name").value=tournament.name;

  $("edit-description").value=
    tournament.description||"";

  await Promise.all([
    loadSummary(),
    loadCompetitors(),
    loadBracket(),
    loadBettors()
  ]);
}

async function loadSummary(){

  const d=await api(
    `/api/tournaments/${tournamentId}/summary`
  );

  const items=[
    ["Status",d.tournament.status],
    ["Competitors",d.competitors.count],
    ["Matches",`${d.matches.completed} / ${d.matches.total}`],
    ["Betting Open",d.matches.betting_open],
    [
      "Total Wagered",
      `${Number(d.betting.total_wagered).toLocaleString()}g`
    ],
    [
      "Bettors",
      d.betting.bettor_count
    ],
    [
      "Payouts",
      `${Number(d.betting.total_payouts).toLocaleString()}g`
    ],
    [
      "Tournament Cut",
      `${Number(d.tournament.cut).toLocaleString()}g`
    ]
  ];

  $("summary").innerHTML=items.map(x=>`
    <div class="card stat">
      <div class="muted small">
        ${x[0]}
      </div>

      <strong>
        ${html(x[1])}
      </strong>
    </div>
  `).join("");
}

$("edit-tournament-form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    try{

      const d=await api(
        `/api/admin/tournaments/${tournamentId}`,
        {
          method:"PUT",
          body:JSON.stringify({
            name:$("edit-name").value,
            description:$("edit-description").value
          })
        }
      );

      setMessage(
        `Saved ${d.name}.`,
        "success"
      );

      await loadAll();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

document.querySelectorAll("[data-status]")
.forEach(
  b=>b.addEventListener(
    "click",
    async()=>{

      try{

        const d=await api(
          `/api/admin/tournaments/${tournamentId}/status`,
          {
            method:"POST",
            body:JSON.stringify({
              status:b.dataset.status
            })
          }
        );

        setMessage(
          `Tournament status: ${d.status}`,
          "success"
        );

        await loadAll();

      }catch(err){

        setMessage(
          err.message,
          "error"
        );

      }

    }
  )
);

$("delete-tournament").addEventListener(
  "click",
  async()=>{

    if(!tournament){
      return;
    }

    if(
      !confirm(
        `Delete tournament #${tournament.id} “${tournament.name}”? This permanently deletes its bracket, wagers and payouts.`
      )
    ){
      return;
    }

    try{

      const d=await api(
        `/api/admin/tournaments/${tournamentId}`,
        {
          method:"DELETE"
        }
      );

      tournamentId=null;

      setMessage(
        `Deleted ${d.deleted.name}.`,
        "success"
      );

      await loadAll();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

async function loadCompetitors(){

  competitors=await fetch(
    `/api/competitors?tournament_id=${tournamentId}`
  ).then(async r=>{

    const data=await r.json();

    if(!r.ok){
      throw new Error(
        data.error||"Could not load competitors"
      );
    }

    return data;
  });

  $("competitors").innerHTML=
    competitors.length
    ?competitors.map(c=>`
      <div class="competitor card">

        <div class="item-row">

          <div>
            <strong>
              ${html(c.name)}
            </strong>

            <div class="muted small">
              ID ${c.id}
            </div>
          </div>

          <button
            type="button"
            class="danger"
            onclick="deleteCompetitor(${c.id})"
          >
            Remove
          </button>

        </div>

      </div>
    `).join("")
    :`<div class="empty">
        No competitors yet.
      </div>`;
}

async function deleteCompetitor(id){

  const competitor=competitors.find(
    c=>Number(c.id)===Number(id)
  );

  if(!competitor){
    setMessage(
      "Competitor not found. Refresh and try again.",
      "error"
    );
    return;
  }

  if(!confirm(
    `Remove competitor "${competitor.name}"?`
  )){
    return;
  }

  try{

    await api(
      `/api/admin/competitors/${id}`,
      {
        method:"DELETE"
      }
    );

    setMessage(
      `Removed ${competitor.name}.`,
      "success"
    );

    await loadCompetitors();
    await loadSummary();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

$("competitor-form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    try{

      const d=await api(
        "/api/admin/competitors",
        {
          method:"POST",
          body:JSON.stringify({
            tournament_id:tournamentId,
            name:$("competitor-name").value
          })
        }
      );

      $("competitor-name").value="";

      setMessage(
        `Added ${d.name}.`,
        "success"
      );

      await loadCompetitors();
      await loadSummary();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

$("generate-bracket").addEventListener(
  "click",
  async()=>{

    if(
      !confirm(
        "Generate the bracket from the current competitor list? This cannot be undone without deleting the tournament."
      )
    ){
      return;
    }

    try{

      const d=await api(
        `/api/admin/tournaments/${tournamentId}/bracket/generate`,
        {
          method:"POST",
          body:"{}"
        }
      );

      setMessage(
        `Bracket generated: ${d.bracket_size}-slot bracket.`,
        "success"
      );

      await loadTournament();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

$("process-byes").addEventListener(
  "click",
  async()=>{

    try{

      const d=await api(
        `/api/admin/tournaments/${tournamentId}/bracket/byes`,
        {
          method:"POST",
          body:"{}"
        }
      );

      setMessage(
        `Processed ${d.byes_processed} byes.`,
        "success"
      );

      await loadBracket();
      await loadSummary();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

async function loadBracket(){

  const previousMatchId=$("wager-match").value;

  const d=await fetch(
    `/api/tournaments/${tournamentId}/bracket`
  ).then(async r=>{

    const x=await r.json();

    if(!r.ok){
      throw new Error(
        x.error||"Could not load bracket"
      );
    }

    return x;
  });

  rounds=d.rounds||[];

  renderBracket();
  await loadSettlementInfo();

  const matches=rounds.flatMap(
    r=>r.matches.map(
      m=>({
        ...m,
        round_name:r.name
      })
    )
  );

  const select=$("wager-match");

  const eligibleMatches=matches.filter(
    m=>
      m.competitor_a &&
      m.competitor_b &&
      m.status!=="completed"
  );

  select.innerHTML=eligibleMatches.map(
    m=>`
      <option value="${m.id}">
        ${html(m.round_name)} #${m.match_number}:
        ${html(m.competitor_a.name)}
        vs
        ${html(m.competitor_b.name)}
      </option>
    `
  ).join("");

  if(
    previousMatchId &&
    eligibleMatches.some(
      m=>String(m.id)===String(previousMatchId)
    )
  ){
    select.value=previousMatchId;
  }

  updateWagerCompetitors();

  if(select.value){
    await loadWagers();
  }else{
    $("wagers").innerHTML="";
    $("wager-odds").textContent=
      "No open match selected.";
  }
}

function renderBracket(){

  $("bracket").innerHTML=
    rounds.length
    ?rounds.map(
      r=>`
        <div class="card">

          <h3>
            ${html(r.name)}
          </h3>

          ${r.matches.map(matchCard).join("")}

        </div>
      `
    ).join("")
    :`<div class="empty">
        No bracket generated.
      </div>`;
}

function matchCard(m){

  const a=m.competitor_a;
  const b=m.competitor_b;

  const aWinner=Boolean(a && Number(m.winner_id)===Number(a.id));
  const bWinner=Boolean(b && Number(m.winner_id)===Number(b.id));
  const winner=aWinner?a:bWinner?b:null;

  const statusLabel={
    setup:"PENDING",
    betting:"BETTING OPEN",
    in_progress:"IN PROGRESS",
    completed:"COMPLETED"
  }[m.status]||String(m.status||"PENDING").replaceAll("_"," ").toUpperCase();

  return `
    <article class="match-card match admin-match-card">

      <div class="match-meta">
        <span>MATCH ${m.match_number}</span>
        <span class="match-status ${m.status==='completed'?'complete':m.status==='betting'?'betting':m.status==='in_progress'?'in_progress':'pending'}">
          ${html(statusLabel)}
        </span>
      </div>

      <div class="fighter ${aWinner ? "winner" : ""}">
        <div>
          <span class="fighter-name">${html(a?.name||"BYE")}</span>
          ${aWinner ? '<span class="winner-label">WINNER</span>' : ""}
        </div>
      </div>

      <div class="vs">VS</div>

      <div class="fighter ${bWinner ? "winner" : ""}">
        <div>
          <span class="fighter-name">${html(b?.name||"BYE")}</span>
          ${bWinner ? '<span class="winner-label">WINNER</span>' : ""}
        </div>
      </div>

      ${!a || !b ? '<div class="bye-label">BYE / WAITING FOR ADVANCEMENT</div>' : ""}

      <div class="admin-match-actions">
        <div class="inline-actions">

          ${
            a &&
            b &&
            m.status!=="completed"
            ?`
              <button
                type="button"
                class="secondary"
                onclick="toggleBetting(
                  ${m.id},
                  ${!m.betting_open}
                )"
              >
                ${
                  m.betting_open
                    ?"Close Betting"
                    :"Open Betting"
                }
              </button>

              <button
                type="button"
                onclick="setWinner(
                  ${m.id},
                  ${a.id}
                )"
              >
                ${html(a.name)} Wins
              </button>

              <button
                type="button"
                onclick="setWinner(
                  ${m.id},
                  ${b.id}
                )"
              >
                ${html(b.name)} Wins
              </button>
            `
            :""
          }

          ${
            m.status==="completed"
            ?`
              <button
                type="button"
                class="danger"
                onclick="undoWinner(${m.id})"
              >
                Undo Winner
              </button>

              ${
                m.settlement_id
                  ?""
                  :`
                    <button
                      type="button"
                      class="secondary"
                      onclick="settleMatch(${m.id})"
                    >
                      Settle
                    </button>
                  `
              }
            `
            :""
          }

        </div>
      </div>

      ${
        m.status==="completed"
          ?`<div
              id="payouts-${m.id}"
              class="match-payouts"
              data-match-id="${m.id}"
            >
              <div class="muted small">Loading payout information...</div>
            </div>`
          :""
      }

    </article>
  `;
}

async function loadSettlementInfo(){

  const completedMatches=rounds.flatMap(
    r=>r.matches.filter(
      m=>m.status==="completed"
    )
  );

  await Promise.all(
    completedMatches.map(
      async m=>{

        const container=$(`payouts-${m.id}`);
        if(!container) return;

        try{

          const d=await api(
            `/api/admin/matches/${m.id}/settlement`
          );

          m.settlement_id=d.settlement.id;
          renderPayoutInfo(container,d.settlement,d.payouts||[]);

          const matchActions=container.parentElement?.querySelector('.inline-actions');
          if(matchActions){
            const settleButton=matchActions.querySelector(
              `button[onclick="settleMatch(${m.id})"]`
            );
            if(settleButton) settleButton.remove();
          }

        }catch(e){

          if(e.message==="Match has not been settled"){
            container.innerHTML=`
              <div class="muted small">
                No payout has been finalized yet. Settle this match to calculate exactly who gets paid and how much.
              </div>
            `;
          }else{
            container.innerHTML=`
              <div class="error small">
                Could not load payout information: ${html(e.message)}
              </div>
            `;
          }
        }
      }
    )
  );
}

function renderPayoutInfo(container,settlement,payouts){

  const grouped=new Map();

  for(const payout of payouts){
    const key=String(payout.bettor_id);
    const existing=grouped.get(key);

    if(existing){
      existing.amount+=Number(payout.amount);
      existing.wagers+=1;
    }else{
      grouped.set(key,{
        bettor_id:payout.bettor_id,
        bettor_name:payout.bettor_name,
        amount:Number(payout.amount),
        wagers:1
      });
    }
  }

  const bettorsToPay=[...grouped.values()];
  const totalPayouts=bettorsToPay.reduce(
    (sum,p)=>sum+p.amount,
    0
  );

  container.innerHTML=`
    <div class="payout-header">
      <strong>PAY THESE BETTORS</strong>
      <span class="muted small">${bettorsToPay.length} person${bettorsToPay.length===1?"":"s"}</span>
    </div>

    ${
      bettorsToPay.length
        ?`<div class="payout-list">
            ${bettorsToPay.map(
              p=>`
                <div class="payout-row">
                  <div>
                    <strong>${html(p.bettor_name)}</strong>
                    <div class="muted small">
                      ${p.wagers} winning bet${p.wagers===1?"":"s"}
                    </div>
                  </div>
                  <strong>${p.amount.toLocaleString()}g</strong>
                </div>
              `
            ).join("")}
          </div>`
        :`<div class="muted small">No winning bets. There is nobody to pay.</div>`
    }

    <div class="payout-summary">
      <div>
        <span class="muted small">Total pool</span>
        <strong>${Number(settlement.total_pool).toLocaleString()}g</strong>
      </div>
      <div>
        <span class="muted small">Tournament cut</span>
        <strong>${Number(settlement.tournament_cut).toLocaleString()}g</strong>
      </div>
      <div>
        <span class="muted small">Total to pay</span>
        <strong>${totalPayouts.toLocaleString()}g</strong>
      </div>
    </div>
  `;
}

async function toggleBetting(id,open){

  try{

    await api(
      `/api/admin/matches/${id}/betting`,
      {
        method:"POST",
        body:JSON.stringify({
          open
        })
      }
    );

    setMessage(
      open
        ?"Betting opened."
        :"Betting closed.",
      "success"
    );

    await loadBracket();
    await loadSummary();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

async function setWinner(id,winner_id){

  if(!confirm("Record this winner?")){
    return;
  }

  try{

    await api(
      `/api/admin/matches/${id}/winner`,
      {
        method:"POST",
        body:JSON.stringify({
          winner_id
        })
      }
    );

    setMessage(
      "Winner recorded and advanced.",
      "success"
    );

    await loadTournament();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

async function undoWinner(id){

  if(
    !confirm(
      "Undo this winner? The match will be returned to pending and the winner will be removed from the next round."
    )
  ){
    return;
  }

  try{

    await api(
      `/api/admin/matches/${id}/undo-winner`,
      {
        method:"POST",
        body:"{}"
      }
    );

    setMessage(
      "Winner undone.",
      "success"
    );

    await loadTournament();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

async function settleMatch(id){

  if(
    !confirm(
      "Settle this match and finalize payouts?"
    )
  ){
    return;
  }

  try{

    const d=await api(
      `/api/admin/matches/${id}/settle`,
      {
        method:"POST",
        body:"{}"
      }
    );

    setMessage(
      `Settled: ${Number(
        d.settlement.total_pool
      ).toLocaleString()}g pool, ${
        Number(
          d.settlement.tournament_cut
        ).toLocaleString()
      }g cut.`,
      "success"
    );

    await loadTournament();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

async function loadBettors(){

  bettors=await api(
    `/api/admin/bettors?tournament_id=${tournamentId}`
  );

  $("bettors").innerHTML=
    bettors.length
    ?bettors.map(
      b=>`
        <div class="card">

          <strong>
            ${html(b.name)}
          </strong>

          <div class="muted small">
            ID ${b.id}
          </div>

        </div>
      `
    ).join("")
    :`<div class="empty">
        No bettors yet.
      </div>`;

  $("wager-bettor").innerHTML=
    bettors.map(
      b=>`
        <option value="${b.id}">
          ${html(b.name)}
        </option>
      `
    ).join("");
}

$("bettor-form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    try{

      const d=await api(
        "/api/admin/bettors",
        {
          method:"POST",
          body:JSON.stringify({
            tournament_id:tournamentId,
            name:$("bettor-name").value
          })
        }
      );

      $("bettor-name").value="";

      setMessage(
        `Added bettor ${d.name}.`,
        "success"
      );

      await loadBettors();
      await loadSummary();

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

$("wager-match").addEventListener(
  "change",
  async()=>{

    updateWagerCompetitors();
    await loadWagers();

  }
);

$("wager-competitor").addEventListener(
  "change",
  loadOdds
);

function updateWagerCompetitors(){

  const m=rounds
    .flatMap(r=>r.matches)
    .find(
      x=>Number(x.id)===
        Number($("wager-match").value)
    );

  const s=$("wager-competitor");

  s.innerHTML=
    m
    ?[
        m.competitor_a,
        m.competitor_b
      ]
      .filter(Boolean)
      .map(
        c=>`
          <option value="${c.id}">
            ${html(c.name)}
          </option>
        `
      ).join("")
    :"";

  loadOdds();
}

async function loadOdds(){

  const id=$("wager-match").value;

  if(!id){

    $("wager-odds").textContent=
      "No open match selected.";

    return;
  }

  try{

    const d=await fetch(
      `/api/matches/${id}/odds`
    ).then(r=>r.json());

    $("wager-odds").textContent=
      `${d.competitor_a.name}: ${
        d.competitor_a.odds==null
          ?"—"
          :d.competitor_a.odds.toFixed(3)+"x"
      } (${
        Number(
          d.competitor_a.pool
        ).toLocaleString()
      }g) · ${
        d.competitor_b.name
      }: ${
        d.competitor_b.odds==null
          ?"—"
          :d.competitor_b.odds.toFixed(3)+"x"
      } (${
        Number(
          d.competitor_b.pool
        ).toLocaleString()
      }g) · Total ${
        Number(
          d.total_pool
        ).toLocaleString()
      }g`;

  }catch(e){

    $("wager-odds").textContent=
      e.message;

  }
}

$("wager-form").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const selectedMatchId=
      $("wager-match").value;

    try{

      const d=await api(
        "/api/admin/wagers",
        {
          method:"POST",
          body:JSON.stringify({
            match_id:Number(
              selectedMatchId
            ),
            bettor_id:Number(
              $("wager-bettor").value
            ),
            competitor_id:Number(
              $("wager-competitor").value
            ),
            amount:Number(
              $("wager-amount").value
            )
          })
        }
      );

      $("wager-amount").value="";

      setMessage(
        `Recorded ${
          Number(d.amount).toLocaleString()
        }g wager.`,
        "success"
      );

      await loadBracket();
      await loadSummary();

      if(
        [...$("wager-match").options]
          .some(
            option=>
              String(option.value)===
              String(selectedMatchId)
          )
      ){

        $("wager-match").value=
          selectedMatchId;

        updateWagerCompetitors();
        await loadWagers();

      }

    }catch(err){

      setMessage(
        err.message,
        "error"
      );

    }

  }
);

async function loadWagers(){

  const id=$("wager-match").value;

  if(!id){

    $("wagers").innerHTML="";

    return;
  }

  try{

    const rows=await api(
      `/api/admin/wagers?match_id=${id}`
    );

    $("wagers").innerHTML=
      rows.length
      ?rows.map(
        w=>`
          <div class="card item-row">

            <span>

              <strong>
                ${html(w.bettor_name)}
              </strong>

              →
              ${html(w.competitor_name)}
              ·
              ${Number(
                w.amount
              ).toLocaleString()}g

              <span class="muted small">

                ${html(w.status)}
                ·

                ${
                  w.odds_at_bet==null
                    ?"—"
                    :Number(
                        w.odds_at_bet
                      ).toFixed(3)+"x"
                }

              </span>

            </span>

            ${
              w.status==="pending"
              ?`
                <button
                  type="button"
                  class="danger"
                  onclick="deleteWager(${w.id})"
                >
                  Delete
                </button>
              `
              :`
                <strong>
                  ${Number(
                    w.payout
                  ).toLocaleString()}g
                </strong>
              `
            }

          </div>
        `
      ).join("")
      :`<div class="empty">
          No wagers.
        </div>`;

    await loadOdds();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

async function deleteWager(id){

  if(
    !confirm(
      "Delete this pending wager?"
    )
  ){
    return;
  }

  try{

    await api(
      `/api/admin/wagers/${id}`,
      {
        method:"DELETE"
      }
    );

    setMessage(
      "Wager deleted.",
      "success"
    );

    await loadWagers();
    await loadBracket();
    await loadSummary();

  }catch(e){

    setMessage(
      e.message,
      "error"
    );

  }
}

</script>

</body>
</html>
