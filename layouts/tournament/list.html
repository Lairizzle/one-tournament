<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament | One Tournament</title>
  {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">OT</span>
        <span>
          <strong>ONE TOURNAMENT</strong>
          <small>UO OUTLANDS</small>
        </span>
      </a>
      <a class="header-link" href="/">ALL TOURNAMENTS</a>
    </div>
  </header>

  <main class="shell page">
    <div id="app">
      <div class="loading-card">Loading tournament...</div>
    </div>
  </main>

  <script>
    const tournamentId = Number(new URLSearchParams(location.search).get("id"));
    const app = document.getElementById("app");

    async function api(path) {
      const response = await fetch(path);
      let data;
      try { data = await response.json(); }
      catch { throw new Error("Invalid API response."); }
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        "'": "&#39;", '"': "&quot;"
      }[c]));
    }

    function num(value) {
      return Number(value || 0).toLocaleString();
    }

    function gold(value) {
      return `${num(value)}g`;
    }

    function get(obj, paths, fallback = null) {
      for (const path of paths) {
        let value = obj;
        for (const key of path.split(".")) {
          value = value?.[key];
        }
        if (value !== undefined && value !== null) return value;
      }
      return fallback;
    }

    function statusClass(status) {
      const value = String(status || "setup").toLowerCase();
      return {
        setup: "pending",
        pending: "pending",
        betting: "betting",
        in_progress: "in_progress",
        completed: "complete",
        complete: "complete"
      }[value] || "pending";
    }

    function currentRound(rounds) {
      for (const round of rounds) {
        const active = (round.matches || []).some(m =>
          m.competitor_a && m.competitor_b && (m.status !== "complete" && m.status !== "completed")
        );
        if (active) return round;
      }
      return rounds.find(r => (r.matches || []).some(m => (m.status !== "complete" && m.status !== "completed")))
        || rounds[rounds.length - 1]
        || null;
    }

    function competitorName(c) {
      return c?.name || "TBD";
    }

    function matchCard(match, odds) {
      const a = match.competitor_a;
      const b = match.competitor_b;
      const winner = Number(match.winner_id);

      const aWinner = a && Number(a.id) === winner;
      const bWinner = b && Number(b.id) === winner;
      const complete = String(match.status || "").toLowerCase() === "completed" ||
        String(match.status || "").toLowerCase() === "complete";

      const open = Boolean(match.betting_open) &&
        Boolean(a && b) &&
        !complete;

      const oa = odds?.competitor_a || {};
      const ob = odds?.competitor_b || {};
      const betting = match.betting || {};

      const pendingTotal = Number(
        betting.pending_total_pool ?? odds?.total_pool ?? odds?.total ?? 0
      );
      const pendingA = Number(
        betting.pending_a_pool ?? oa.pool ?? 0
      );
      const pendingB = Number(
        betting.pending_b_pool ?? ob.pool ?? 0
      );

      const settled = Boolean(betting.settlement_id);
      const finalTotal = settled
        ? Number(betting.settled_total_pool || 0)
        : pendingTotal;
      const finalPayout = Number(betting.settled_payout_pool || 0);
      const finalCut = Number(betting.settled_tournament_cut || 0);

      let bettingInfo = "";

      if (a && b) {
        if (open) {
          const payout = Math.floor(pendingTotal * 0.90);

          bettingInfo = `
            <div class="match-betting">
              <div class="betting-head">
                <span>LIVE BETTING</span>
                <span class="live-dot">● OPEN</span>
              </div>

              <div class="odds-row">
                <div class="odds-card">
                  <span class="odds-name">${esc(oa.name || a.name)}</span>
                  <strong>${oa.odds != null ? Number(oa.odds).toFixed(2) + "x" : "—"}</strong>
                  <small>${gold(pendingA)} wagered</small>
                </div>
                <div class="odds-card">
                  <span class="odds-name">${esc(ob.name || b.name)}</span>
                  <strong>${ob.odds != null ? Number(ob.odds).toFixed(2) + "x" : "—"}</strong>
                  <small>${gold(pendingB)} wagered</small>
                </div>
              </div>

              <div class="pool-line">
                <span>Total pool <b>${gold(pendingTotal)}</b></span>
                <span>90% payout <b>${gold(payout)}</b></span>
              </div>
            </div>
          `;
        } else if (complete) {
          bettingInfo = `
            <div class="match-betting match-betting-final">
              <div class="betting-head">
                <span>BETTING RESULT</span>
                <span>${settled ? "● SETTLED" : "● CLOSED"}</span>
              </div>

              <div class="pool-line">
                <span>Final pool <b>${gold(finalTotal)}</b></span>
                ${settled
                  ? `<span>Paid out <b>${gold(finalPayout)}</b></span>`
                  : `<span>No settlement recorded</span>`
                }
              </div>

              ${
                settled
                  ? `<div class="pool-line">
                       <span>Tournament cut <b>${gold(finalCut)}</b></span>
                     </div>`
                  : ""
              }
            </div>
          `;
        } else {
          bettingInfo = `
            <div class="match-betting match-betting-closed">
              <div class="betting-head">
                <span>BETTING POOL</span>
                <span>${pendingTotal > 0 ? "● CLOSED" : "● NO BETS"}</span>
              </div>

              <div class="odds-row">
                <div class="odds-card">
                  <span class="odds-name">${esc(a.name)}</span>
                  <strong>${gold(pendingA)}</strong>
                  <small>wagered</small>
                </div>
                <div class="odds-card">
                  <span class="odds-name">${esc(b.name)}</span>
                  <strong>${gold(pendingB)}</strong>
                  <small>wagered</small>
                </div>
              </div>

              <div class="pool-line">
                <span>Total pool <b>${gold(pendingTotal)}</b></span>
              </div>
            </div>
          `;
        }
      }

      let result = "";

      if (complete) {
        result = `
          <div class="match-result">
            <span>MATCH COMPLETE</span>
            ${aWinner || bWinner
              ? `<strong>${esc((aWinner ? a : b).name)} advances</strong>`
              : ""
            }
          </div>
        `;
      } else if (!open) {
        result = `
          <div class="match-result pending-result">
            <span>BETTING CLOSED</span>
            <strong>Awaiting match</strong>
          </div>
        `;
      }

      return `
        <article class="match-card">
          <div class="match-meta">
            <span>MATCH ${esc(match.match_number)}</span>
            <span class="match-status ${statusClass(match.status)}">${esc(match.status || "pending")}</span>
          </div>

          <div class="fighter ${aWinner ? "winner" : ""}">
            <div>
              <span class="fighter-name">${esc(competitorName(a))}</span>
              ${aWinner ? '<span class="winner-label">WINNER</span>' : ""}
            </div>
          </div>

          <div class="vs">VS</div>

          <div class="fighter ${bWinner ? "winner" : ""}">
            <div>
              <span class="fighter-name">${esc(competitorName(b))}</span>
              ${bWinner ? '<span class="winner-label">WINNER</span>' : ""}
            </div>
          </div>

          ${!a || !b ? '<div class="bye-label">BYE / WAITING FOR ADVANCEMENT</div>' : ""}
          ${result}
          ${bettingInfo}
        </article>
      `;
    }

    async function load() {
      if (!tournamentId) throw new Error("No tournament selected.");

      const summary = await api(`/api/tournaments/${tournamentId}/summary`);
      const bracket = await api(`/api/tournaments/${tournamentId}/bracket`);

      const tournament = summary.tournament || {};
      const rounds = bracket.rounds || [];
      const activeRound = currentRound(rounds);
      const matches = rounds.flatMap(r => r.matches || []);

      const oddsEntries = await Promise.all(matches.map(async match => {
        if (!match.betting_open || !match.competitor_a || !match.competitor_b || (match.status === "complete" || match.status === "completed")) {
          return [match.id, null];
        }
        try {
          return [match.id, await api(`/api/matches/${match.id}/odds`)];
        } catch {
          return [match.id, null];
        }
      }));

      const oddsMap = new Map(oddsEntries);

      const totalMatches = Number(get(summary, [
        "matches.total", "match_count", "total_matches"
      ], matches.length));

      const completed = Number(get(summary, [
        "matches.completed", "completed_matches"
      ], matches.filter(m => (m.status === "complete" || m.status === "completed")).length));

      const openMatches = Number(get(summary, [
        "matches.betting_open", "betting_open"
      ], matches.filter(m => m.betting_open).length));

      const totalWagered = Number(get(summary, [
        "betting.total_wagered", "total_wagered", "total_pool"
      ], 0));

      const bettors = Number(get(summary, [
        "betting.bettor_count", "bettor_count", "bettors"
      ], 0));

      const cut = Number(get(summary, [
        "tournament.cut", "tournament_cut", "cut"
      ], Math.floor(totalWagered * 0.10)));

      const payout = Math.max(0, totalWagered - cut);
      const champion = get(summary, ["champion", "tournament.champion"], null);

      app.innerHTML = `
        <section class="tournament-hero">
          <div class="hero-main">
            <div class="kicker">${esc(tournament.status || "TOURNAMENT")}</div>
            <h1>${esc(tournament.name || "Tournament")}</h1>
            <p>${esc(tournament.description || "")}</p>
          </div>

          <div class="round-banner">
            <span>CURRENT ROUND</span>
            <strong>${esc(activeRound?.name || "Bracket not started")}</strong>
          </div>

          ${champion ? `
            <div class="champion-banner">
              <span>TOURNAMENT CHAMPION</span>
              <strong>⚔ ${esc(champion.name || champion)}</strong>
            </div>
          ` : ""}
        </section>

        <section class="stats-grid">
          <div class="stat-card featured">
            <span>TOTAL BETTING POOL</span>
            <strong>${gold(totalWagered)}</strong>
          </div>
          <div class="stat-card">
            <span>90% PAYOUT POOL</span>
            <strong>${gold(payout)}</strong>
          </div>
          <div class="stat-card">
            <span>TOURNAMENT CUT</span>
            <strong>${gold(cut)}</strong>
          </div>
          <div class="stat-card">
            <span>BETTORS</span>
            <strong>${num(bettors)}</strong>
          </div>
          <div class="stat-card">
            <span>COMPETITORS</span>
            <strong>${num(get(summary, ["competitors.count", "competitor_count"], matches.length))}</strong>
          </div>
          <div class="stat-card">
            <span>MATCHES</span>
            <strong>${completed} / ${totalMatches}</strong>
          </div>
          <div class="stat-card">
            <span>BETTING OPEN</span>
            <strong>${num(openMatches)}</strong>
          </div>
        </section>

        <section class="section">
          <div class="section-heading">
            <div>
              <div class="kicker">LIVE ACTION</div>
              <h2>Betting Board</h2>
            </div>
            <span class="refresh-label">UPDATES AUTOMATICALLY</span>
          </div>

          <div class="live-matches">
            ${matches.filter(m =>
              m.betting_open && m.competitor_a && m.competitor_b && (m.status !== "complete" && m.status !== "completed")
            ).map(m => matchCard(m, oddsMap.get(m.id))).join("") || `
              <div class="empty-state compact">
                <h3>No live betting matches</h3>
                <p>Betting will appear here when a match is opened.</p>
              </div>
            `}
          </div>
        </section>

        <section class="section">
          <div class="section-heading">
            <div>
              <div class="kicker">TOURNAMENT</div>
              <h2>Bracket</h2>
            </div>
          </div>

          <div class="bracket">
            ${rounds.map(round => `
              <div class="bracket-round">
                <div class="round-heading">
                  <span>${esc(round.name)}</span>
                  <small>${(round.matches || []).length} MATCHES</small>
                </div>
                ${(round.matches || []).map(m =>
                  matchCard(m, oddsMap.get(m.id))
                ).join("")}
              </div>
            `).join("") || `
              <div class="empty-state compact">
                <h3>Bracket not generated</h3>
                <p>The tournament administrator has not generated the bracket yet.</p>
              </div>
            `}
          </div>
        </section>
      `;

      setTimeout(load, 30000);
    }

    load().catch(error => {
      app.innerHTML = `
        <div class="empty-state error-state">
          <h1>Tournament unavailable</h1>
          <p>${esc(error.message)}</p>
          <a class="button" href="/">← Back to tournaments</a>
        </div>
      `;
    });
  </script>
</body>
</html>
